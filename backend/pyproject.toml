[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-observatory"
version = "0.1.0"
description = "Local-first auditable multi-agent session observatory"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<4",
    "SQLAlchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "zstandard>=0.22,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-xdist>=3.5,<4",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
agent-observatory = "agent_observatory.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"


[tool.setuptools.packages.find]
where = ["."]
include = ["agent_observatory*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_observatory"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
]
